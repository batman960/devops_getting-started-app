name: Dzisiejsze Cwiczenia - Node.js Pipeline

# WYMÓG 1: Akcja reagująca na zmianę w ino_dev
on:
  push:
    branches:
      - ino_dev

jobs:
  ci-cd-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Pobranie kodu (Checkout)
        uses: actions/checkout@v4

      - name: Przygotowanie srodowiska Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # WYMÓG 2 & 3: Weryfikacja budowy i odtworzenie struktury z Jenkinsa
      - name: Etap Build & Test (Zaleznosci Node.js)
        run: |
          echo "Rozpoczynam instalacje zaleznosci..."
          npm install
          echo "Testowanie aplikacji..."
          npm test --if-present || echo "Brak zdefiniowanych testow, kontynuuje."

      # WYMÓG 4: Załączenie zbudowanego artefaktu
      - name: Przygotowanie plikow do Artefaktu
        run: |
          mkdir -p build_output
          tar -cvf build_output/gotowa-aplikacja.tar src package.json README.md

      - name: Publikacja Artefaktu w GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: paczka-z-aplikacja
          path: build_output/gotowa-aplikacja.tar
